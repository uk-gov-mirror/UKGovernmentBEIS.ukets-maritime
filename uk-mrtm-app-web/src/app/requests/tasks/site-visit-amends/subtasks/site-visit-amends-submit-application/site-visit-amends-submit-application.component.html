<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <netz-page-heading>Send application to regulator</netz-page-heading>
    <mrtm-site-visit-reporting-year-summary-template [reportingYear]="reportingYear()" />
    <h4 class="govuk-heading-s">Your application will be sent directly to your regulator</h4>
    <p class="govuk-body govuk-!-margin-bottom-8">
      By selecting ‘Confirm and send’ you confirm that the information in your application is correct to the best of
      your knowledge.
    </p>

    <button type="button" govukButton netzPendingButton (click)="onSubmit()">Confirm and send</button>
  </div>
</div>
<div>
  <hr class="govuk-section-break govuk-section-break--m govuk-section-break--visible" aria-hidden="true" />
  <netz-return-to-task-or-action-page />
</div>
