<div class="hods-loading-spinner" [class.govuk-!-padding-top-4]="hasPaddingTop()">
  <div class="hods-loading-spinner__spinner" aria-live="polite" role="status" [style.--spinner-size.px]="size()"></div>
  @if (title()) {
    <div class="hods-loading-spinner__content">
      <h1 class="govuk-heading-m">{{ title() }}</h1>
    </div>
  }
</div>
